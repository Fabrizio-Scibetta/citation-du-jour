# Met à jour la citation du widget Windows chaque matin, sans serveur.
# IMPORTANT : remplacez VOTRE-PSEUDO et le nom du dépôt ci-dessous
# par l'URL réelle de votre site GitHub Pages.
name: Widget quotidien

on:
  schedule:
    # 05:30 UTC = 06:30 à Paris (hiver) / 07:30 (été)
    - cron: "30 5 * * *"
  workflow_dispatch: {} # permet le déclenchement à la main

permissions:
  contents: write

jobs:
  maj-widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer les données du widget
        env:
          APP_BASE_URL: https://fabrizio-scibetta.github.io/citation-du-jour
        run: python tools/update_widget.py

      - name: Publier si le fichier a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add widgets/widget-data.json
          git commit -m "Widget : citation du $(date +%d/%m/%Y)" || echo "Rien à publier"
          git push
